# When the preview branch changes, ask the "Publish site" workflow (which
# always runs from main) to rebuild the site so /preview updates.
name: Update preview

on:
  push:
    branches: [preview]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
